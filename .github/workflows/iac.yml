name: IaC review and guarded apply

on:
  pull_request:
    paths: ["infra/**", "deploy/**", "scripts/iac-plan.sh", ".github/workflows/iac.yml"]
  push:
    branches: [main]
    paths: ["infra/**", "deploy/**", "scripts/iac-plan.sh", ".github/workflows/iac.yml"]
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the reviewed saved plan after Environment approval"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: insighthub-iac-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@3c0c5d2e5b5d4c431f0e3f43ee8d4aa6d09b5f8d # v3.1.2
        with: { terraform_version: 1.15.9 }
      - name: Terraform format and validate isolated roots
        run: |
          set -euo pipefail
          terraform fmt -check -recursive infra
          for root in bootstrap core platform kubernetes; do
            terraform -chdir="infra/$root" init -backend=false -input=false
            terraform -chdir="infra/$root" validate
          done
      - name: Install TFLint 0.64.0 with verified manifest
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/tflint-checksums.txt https://github.com/terraform-linters/tflint/releases/download/v0.64.0/checksums.txt
          echo '07496dc0ab06a39fa718a9f8e471112b6e6ab4fd3a9f1024210a55fe3f1a9ff9  /tmp/tflint-checksums.txt' | sha256sum -c -
          curl -fsSLo /tmp/tflint.zip https://github.com/terraform-linters/tflint/releases/download/v0.64.0/tflint_linux_amd64.zip
          grep ' tflint_linux_amd64.zip$' /tmp/tflint-checksums.txt | sed 's#  #  /tmp/#' | sha256sum -c -
          unzip -q /tmp/tflint.zip -d /tmp/tflint
          install /tmp/tflint/tflint /usr/local/bin/tflint
      - name: TFLint
        run: for root in bootstrap core platform kubernetes; do tflint --chdir="infra/$root" --recursive; done
      - name: Install Checkov 3.3.18 with hash
        run: |
          python -m pip download --no-deps --dest /tmp/checkov checkov==3.3.18
          echo '65d746d47725bb843917dd513d8ad0519edfa50201a620c4032cd234b2985f63  /tmp/checkov/checkov-3.3.18-py3-none-any.whl' | sha256sum -c -
          python -m pip install --no-deps /tmp/checkov/checkov-3.3.18-py3-none-any.whl
          checkov -d infra --framework terraform --skip-download --quiet --hard-fail-on HIGH
      - name: Install Conftest 0.70.1 with attestation
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.70.1/conftest_0.70.1_Linux_x86_64.tar.gz
          echo '613d124b8f6c1f3cee890491f7ab19114cca5a2102ca47cb2e6c35b4c23f9c8a  /tmp/conftest.tar.gz' | sha256sum -c -
          gh attestation verify /tmp/conftest.tar.gz --repo open-policy-agent/conftest --signer-workflow open-policy-agent/conftest/.github/workflows/release.yaml --source-ref refs/tags/v0.70.1 --deny-self-hosted-runners
          tar -xzf /tmp/conftest.tar.gz -C /tmp conftest
          install /tmp/conftest /usr/local/bin/conftest
      - name: Conftest unit and fixture plans
        run: |
          conftest verify -p infra/policy/terraform
          conftest test infra/policy/testdata/positive-plan.json -p infra/policy/terraform
          test "$(conftest test infra/policy/testdata/negative-plan.json -p infra/policy/terraform >/dev/null 2>&1; echo $?)" -ne 0
      - name: Helm lint and render without managed credentials
        run: |
          helm lint deploy/helm/insighthub -f deploy/helm/insighthub/values-local.yaml --set-file database.bootstrap.sql=infra/db/init.sql
          helm template insighthub deploy/helm/insighthub -f deploy/helm/insighthub/values-local.yaml --set-file database.bootstrap.sql=infra/db/init.sql >/dev/null
          for env in dev staging; do helm lint deploy/helm/insighthub -f deploy/helm/insighthub/values-$env.yaml; helm template insighthub deploy/helm/insighthub -f deploy/helm/insighthub/values-$env.yaml >/dev/null; done

  application-tests:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Build fixture application images and run tests
        env: { RAG_MODE: fixture, LLM_PROVIDER: fixture, EMBEDDING_PROVIDER: fixture }
        run: |
          docker compose build web api ingestion-worker
          docker compose up -d postgres redis
          make test-backend
      - name: Always remove CI containers
        if: always()
        run: docker compose --profile ollama down --volumes --remove-orphans

  cloud-plan:
    needs: [static, application-tests]
    # Fork PRs never reach a job with id-token or repository secrets. Set the
    # repository variable CLOUD_PLAN_ENABLED=true only after cloud review.
    if: >-
      vars.CLOUD_PLAN_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-24.04
    environment: plan-aws
    permissions: { contents: read, pull-requests: write, id-token: write }
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_CORE_STATE_KEY: ${{ vars.TF_CORE_STATE_KEY }}
      TF_PLATFORM_STATE_KEY: ${{ vars.TF_PLATFORM_STATE_KEY }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_environment: ${{ vars.TF_ENVIRONMENT }}
      TF_VAR_owner: ${{ vars.TF_OWNER }}
      TF_VAR_cost_center: ${{ vars.TF_COST_CENTER }}
      TF_VAR_vpc_cidr: ${{ vars.TF_VPC_CIDR }}
      TF_VAR_availability_zones: ${{ vars.TF_AVAILABILITY_ZONES }}
      TF_VAR_cluster_name: ${{ vars.TF_CLUSTER_NAME }}
      TF_VAR_kubernetes_version: ${{ vars.TF_KUBERNETES_VERSION }}
      TF_VAR_lab_expiry: ${{ vars.TF_LAB_EXPIRY }}
      TF_VAR_github_plan_subject: ${{ vars.TF_GITHUB_PLAN_SUBJECT }}
      TF_VAR_github_apply_subject: ${{ vars.TF_GITHUB_APPLY_SUBJECT }}
      TF_VAR_terraform_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_core_state_key: ${{ vars.TF_CORE_STATE_KEY }}
      TF_VAR_platform_state_key: ${{ vars.TF_PLATFORM_STATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@3c0c5d2e5b5d4c431f0e3f43ee8d4aa6d09b5f8d
        with: { terraform_version: 1.15.9 }
      - name: Require complete reviewed cloud inputs
        env:
          PLAN_ROLE: ${{ vars.TF_PLAN_ROLE_ARN }}
        run: |
          set -euo pipefail
          for key in AWS_REGION TF_STATE_BUCKET TF_CORE_STATE_KEY TF_PLATFORM_STATE_KEY PLAN_ROLE TF_VAR_environment TF_VAR_owner TF_VAR_cost_center TF_VAR_vpc_cidr TF_VAR_availability_zones TF_VAR_cluster_name TF_VAR_kubernetes_version TF_VAR_lab_expiry TF_VAR_github_plan_subject TF_VAR_github_apply_subject; do test -n "${!key}" || { echo "missing required cloud input: $key"; exit 1; }; done
      - name: Assume exact OIDC plan role
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5.1.0
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Create saved plan and source binding
        run: |
          set -euo pipefail
          mkdir -p .ci-plan
          python scripts/verify.py fingerprint > .ci-plan/source.sha256
          terraform -chdir=infra/core init -input=false -reconfigure -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_CORE_STATE_KEY}" -backend-config="region=${AWS_REGION}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          terraform -chdir=infra/core plan -input=false -out=../../.ci-plan/core.tfplan
          sha256sum .ci-plan/core.tfplan > .ci-plan/plan.sha256
          terraform show -json .ci-plan/core.tfplan > .ci-plan/plan.internal.json
      - name: Produce sanitized review summary and destroy gate
        run: |
          set -euo pipefail
          jq '{create: ([.resource_changes[] | select(.change.actions | index("create"))] | length), change: ([.resource_changes[] | select(.change.actions | index("update"))] | length), destroy: ([.resource_changes[] | select(.change.actions | index("delete"))] | length), unknown_values: ([.. | objects | select(has("after_unknown")) | .after_unknown | values | select(. == true)] | length)}' .ci-plan/plan.internal.json > .ci-plan/plan-summary.json
          jq -e '.destroy == 0' .ci-plan/plan-summary.json >/dev/null || { echo 'unexpected destroy: human review required; refusing cost/apply path'; exit 1; }
          rm .ci-plan/plan.internal.json
      - name: Upload private reviewed saved plan only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reviewed-core-plan-${{ github.run_id }}
          path: |
            .ci-plan/core.tfplan
            .ci-plan/plan.sha256
            .ci-plan/source.sha256
          retention-days: 1
          if-no-files-found: error
      - name: Estimate cost and enforce lab budget
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          MAX_LAB_COST_USD: ${{ vars.MAX_LAB_COST_USD }}
        run: |
          set -euo pipefail
          test -n "$INFRACOST_API_KEY" && test -n "$MAX_LAB_COST_USD" || { echo 'missing cost input; refusing apply path'; exit 1; }
          curl -fsSL https://github.com/infracost/infracost/releases/download/v0.10.43/infracost-linux-amd64.tar.gz -o /tmp/infracost.tar.gz
          echo 'ea21bbc939530243a526b22e2f63ae3842b8ba6141ab0c0995bc49a0ad9ef2f4  /tmp/infracost.tar.gz' | sha256sum -c -
          tar -xzf /tmp/infracost.tar.gz -C /tmp infracost
          /tmp/infracost breakdown --path .ci-plan/core.tfplan --format json --out-file .ci-plan/cost.internal.json
          jq '{total_monthly_cost: (.totalMonthlyCost // "unknown"), currency: "USD"}' .ci-plan/cost.internal.json > .ci-plan/cost-summary.json
          total=$(jq -r '.total_monthly_cost' .ci-plan/cost-summary.json)
          test "$total" != unknown && awk "BEGIN { exit !($total <= $MAX_LAB_COST_USD) }" || { echo 'cost is unknown or exceeds lab budget; refusing apply path'; exit 1; }
          rm .ci-plan/cost.internal.json
      - name: Request AI explanation from sanitized data only
        env:
          PLAN_EXPLAINER_URL: ${{ vars.PLAN_EXPLAINER_URL }}
          PLAN_EXPLAINER_API_KEY: ${{ secrets.PLAN_EXPLAINER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$PLAN_EXPLAINER_URL" && test -n "$PLAN_EXPLAINER_API_KEY" || { echo 'AI review input missing; refusing apply path'; exit 1; }
          jq -n --slurpfile plan .ci-plan/plan-summary.json --slurpfile cost .ci-plan/cost-summary.json '{task:"Explain only this sanitized Terraform summary. Cover IAM, network, data risks, unknown values and explicitly require human review.", plan:$plan[0], cost:$cost[0]}' > .ci-plan/explainer-request.json
          curl -fsS --retry 2 -H 'content-type: application/json' -H "authorization: Bearer $PLAN_EXPLAINER_API_KEY" --data @.ci-plan/explainer-request.json "$PLAN_EXPLAINER_URL" | jq -c . > .ci-plan/ai-review.json
          rm .ci-plan/explainer-request.json
      - name: Post sanitized PR review
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## IaC review — human approval required'
            echo; echo '### Sanitized change summary'; echo '```json'; cat .ci-plan/plan-summary.json; echo '```'
            echo; echo '### Cost'; echo '```json'; cat .ci-plan/cost-summary.json; echo '```'
            echo; echo '### AI explanation (sanitized summary only)'; echo '```json'; cat .ci-plan/ai-review.json; echo '```'
            echo; echo 'IAM/network/data risk, unknown values, and all creates require human review. No raw plan, state, endpoint, credential, or secret is included. Destroy is blocked; budget exceedance or missing input blocks apply.'
          } > .ci-plan/pr-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file .ci-plan/pr-comment.md
      - name: Upload public-safe review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sanitized-iac-review-${{ github.run_id }}
          path: .ci-plan/{source.sha256,plan.sha256,plan-summary.json,cost-summary.json,ai-review.json}
          retention-days: 7
          if-no-files-found: error

  guarded-apply:
    needs: cloud-plan
    if: github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: lab-aws
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@3c0c5d2e5b5d4c431f0e3f43ee8d4aa6d09b5f8d
        with: { terraform_version: 1.15.9 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reviewed-core-plan-${{ github.run_id }}
          path: .ci-plan
      - name: Require approved inputs and re-bind source
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_CORE_STATE_KEY: ${{ vars.TF_CORE_STATE_KEY }}
          APPLY_ROLE: ${{ vars.TF_APPLY_ROLE_ARN }}
        run: |
          set -euo pipefail
          test -n "$AWS_REGION" && test -n "$TF_STATE_BUCKET" && test -n "$TF_CORE_STATE_KEY" && test -n "$APPLY_ROLE"
          sha256sum -c .ci-plan/plan.sha256
          test "$(python scripts/verify.py fingerprint)" = "$(cat .ci-plan/source.sha256)" || { echo 'source changed since reviewed plan'; exit 1; }
      - name: Assume exact OIDC apply role after Environment approval
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5.1.0
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Apply exactly the reviewed saved plan
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_CORE_STATE_KEY: ${{ vars.TF_CORE_STATE_KEY }}
        run: |
          terraform -chdir=infra/core init -input=false -reconfigure -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_CORE_STATE_KEY}" -backend-config="region=${AWS_REGION}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          terraform -chdir=infra/core apply -input=false ../../.ci-plan/core.tfplan
