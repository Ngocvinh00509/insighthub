{{- if .Values.chatops.enabled }}
{{- if not .Values.chatops.existingSecret }}{{ fail "chatops.existingSecret is required when chatops.enabled=true" }}{{- end }}
{{- $labels := include "insighthub.labels" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: insighthub-chatops-readonly
  labels: { {{ $labels | replace "\n" ", " }}, app.kubernetes.io/component: chatops }
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: insighthub-chatops-readonly
  labels: { {{ $labels | replace "\n" ", " }}, app.kubernetes.io/component: chatops }
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: insighthub-chatops-readonly
  labels: { {{ $labels | replace "\n" ", " }}, app.kubernetes.io/component: chatops }
subjects:
  - kind: ServiceAccount
    name: insighthub-chatops-readonly
    namespace: {{ .Release.Namespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: insighthub-chatops-readonly }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: insighthub-chatops-config
  labels: { {{ $labels | replace "\n" ", " }}, app.kubernetes.io/component: chatops }
data:
  CHATOPS_QUEUE: {{ .Values.chatops.queue | quote }}
  KUBERNETES_MCP_NAMESPACE: {{ .Values.chatops.namespace | quote }}
  CHATOPS_READ_USERS: {{ .Values.chatops.readUsers | quote }}
  CHATOPS_DIAGNOSTIC_USERS: {{ .Values.chatops.diagnosticUsers | quote }}
  CHATOPS_MUTATION_USERS: {{ .Values.chatops.mutationUsers | quote }}
  CHATOPS_APPROVER_USERS: {{ .Values.chatops.approverUsers | quote }}
  CHATOPS_ALLOW_SELF_APPROVAL: {{ .Values.chatops.allowSelfApproval | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insighthub-chatops-api
  labels: { {{ $labels | replace "\n" ", " }}, app.kubernetes.io/component: chatops }
spec:
  replicas: {{ .Values.chatops.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: insighthub, app.kubernetes.io/component: chatops-api } }
  template:
    metadata: { labels: { app.kubernetes.io/name: insighthub, app.kubernetes.io/component: chatops-api } }
    spec:
      serviceAccountName: insighthub-chatops-readonly
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: chatops-api
          image: {{ .Values.chatops.image.repository }}:{{ .Values.chatops.image.tag }}
          imagePullPolicy: {{ .Values.chatops.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: {{- toYaml .Values.chatops.resources | nindent 12 }}
          envFrom:
            - configMapRef: { name: insighthub-chatops-config }
            - secretRef: { name: {{ .Values.chatops.existingSecret | quote }} }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: insighthub-chatops
  labels: { {{ $labels | replace "\n" ", " }}, app.kubernetes.io/component: chatops }
spec:
  selector: { app.kubernetes.io/name: insighthub, app.kubernetes.io/component: chatops-api }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insighthub-chatops-worker
  labels: { {{ $labels | replace "\n" ", " }}, app.kubernetes.io/component: chatops }
spec:
  replicas: {{ .Values.chatops.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: insighthub, app.kubernetes.io/component: chatops-worker } }
  template:
    metadata: { labels: { app.kubernetes.io/name: insighthub, app.kubernetes.io/component: chatops-worker } }
    spec:
      serviceAccountName: insighthub-chatops-readonly
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: chatops-worker
          image: {{ .Values.chatops.image.repository }}:{{ .Values.chatops.image.tag }}
          imagePullPolicy: {{ .Values.chatops.image.pullPolicy }}
          command: ["arq", "worker.WorkerSettings"]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: {{- toYaml .Values.chatops.resources | nindent 12 }}
          envFrom:
            - configMapRef: { name: insighthub-chatops-config }
            - secretRef: { name: {{ .Values.chatops.existingSecret | quote }} }
          livenessProbe: { exec: { command: ["arq", "--check", "worker.WorkerSettings"] }, initialDelaySeconds: 15, periodSeconds: 30 }
          readinessProbe: { exec: { command: ["arq", "--check", "worker.WorkerSettings"] }, initialDelaySeconds: 15, periodSeconds: 30 }
{{- end }}
