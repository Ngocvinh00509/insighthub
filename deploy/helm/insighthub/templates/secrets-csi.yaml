{{- if .Values.externalSecrets.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: { name: {{ .Values.externalSecrets.secretProviderClass }} }
spec:
  provider: aws
  parameters:
    objects: |
      {{- range .Values.externalSecrets.objects }}
      - objectName: {{ . | quote }}
        objectType: "secretsmanager"
      {{- end }}
{{- end }}
