{{- if .Values.externalSecrets.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.externalSecrets.secretProviderClass }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: {{ required "externalSecrets.secretArn is required when external secrets are enabled" .Values.externalSecrets.secretArn | quote }}
        objectType: "secretsmanager"
        jmesPath:
        {{- range .Values.externalSecrets.keys }}
          - path: {{ . | quote }}
            objectAlias: {{ . | quote }}
        {{- end }}
  secretObjects:
    - secretName: {{ .Values.externalSecrets.secretName }}
      type: Opaque
      data:
      {{- range .Values.externalSecrets.keys }}
        - objectName: {{ . | quote }}
          key: {{ . | quote }}
      {{- end }}
{{- end }}
