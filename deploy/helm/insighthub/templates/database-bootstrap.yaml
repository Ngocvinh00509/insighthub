{{- if and .Values.externalSecrets.enabled .Values.database.bootstrap.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "insighthub.name" . }}-api
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
  annotations:
    "eks.amazonaws.com/role-arn": {{ required "serviceAccounts.apiRoleArn is required when database bootstrap is enabled" .Values.serviceAccounts.apiRoleArn | quote }}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "insighthub.name" . }}-database-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: { app.kubernetes.io/name: insighthub, app.kubernetes.io/component: database-bootstrap }
    spec:
      restartPolicy: OnFailure
      serviceAccountName: insighthub-api
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: bootstrap
          image: {{ .Values.database.bootstrap.image }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              psql "$(cat /mnt/secrets-store/DATABASE_URL)" -v ON_ERROR_STOP=1 <<'SQL'
{{ .Values.database.bootstrap.sql | indent 14 }}
              SQL
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts:
            - name: application-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: application-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.externalSecrets.secretProviderClass }}
{{- end }}
