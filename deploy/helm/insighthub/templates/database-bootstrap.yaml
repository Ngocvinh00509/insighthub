{{- if .Values.database.bootstrap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "insighthub.name" . }}-database-schema
  labels: { {{ include "insighthub.labels" . | replace "\n" ", " }} }
data:
  init.sql: |
{{ required "database.bootstrap.sql is required when database.bootstrap.enabled=true" .Values.database.bootstrap.sql | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "insighthub.name" . }}-database-migration
  labels: { {{ include "insighthub.labels" . | replace "\n" ", " }}, app.kubernetes.io/component: database-migration }
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels: { app.kubernetes.io/name: insighthub, app.kubernetes.io/component: database-migration }
    spec:
      restartPolicy: OnFailure
      serviceAccountName: insighthub-api
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: {{ .Values.database.bootstrap.image }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args: ["psql \"$DATABASE_URL\" -v ON_ERROR_STOP=1 -f /migrations/init.sql"]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: {{- toYaml .Values.database.bootstrap.resources | nindent 12 }}
          {{- if .Values.externalSecrets.enabled }}
          envFrom:
            - secretRef: { name: {{ .Values.externalSecrets.secretName }} }
          {{- else }}
          env:
            - { name: DATABASE_URL, value: {{ .Values.database.url | quote }} }
          {{- end }}
          volumeMounts:
            - { name: schema, mountPath: /migrations, readOnly: true }
          {{- if .Values.externalSecrets.enabled }}
            - { name: application-secrets, mountPath: /mnt/secrets-store, readOnly: true }
          {{- end }}
      volumes:
        - name: schema
          configMap: { name: {{ include "insighthub.name" . }}-database-schema }
        {{- if .Values.externalSecrets.enabled }}
        - name: application-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.externalSecrets.secretProviderClass }}
        {{- end }}
{{- end }}
