{{- if .Values.local.enabled }}
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres }
spec:
  serviceName: postgres
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.2-pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
          env: [{ name: POSTGRES_USER, value: insighthub }, { name: POSTGRES_PASSWORD, value: insighthub }, { name: POSTGRES_DB, value: insighthub }]
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "insighthub", "-d", "insighthub"] }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { exec: { command: ["pg_isready", "-U", "insighthub", "-d", "insighthub"] }, initialDelaySeconds: 15, periodSeconds: 10 }
          volumeMounts:
            - { name: schema, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: schema
          configMap: { name: {{ include "insighthub.name" . }}-database-schema }
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec: { selector: { app: redis }, ports: [{ port: 6379 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: redis }
spec:
  serviceName: redis
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      securityContext: { runAsUser: 999, runAsGroup: 999, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers: [{ name: redis, image: redis:7-alpine, args: ["redis-server", "--appendonly", "yes"], ports: [{ containerPort: 6379 }] }]
{{- end }}
