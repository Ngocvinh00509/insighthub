{{- if .Values.local.enabled }}
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec: { selector: { app: postgres }, ports: [{ name: postgres, port: 5432, targetPort: postgres }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres }
spec:
  serviceName: postgres
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.2-pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
          env: [{ name: POSTGRES_USER, value: insighthub }, { name: POSTGRES_PASSWORD, value: insighthub }, { name: POSTGRES_DB, value: insighthub }]
          ports: [{ name: postgres, containerPort: 5432 }]
          readinessProbe: { exec: { command: ["sh", "-ec", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }, initialDelaySeconds: 5 }
          livenessProbe: { exec: { command: ["sh", "-ec", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }, initialDelaySeconds: 15 }
          resources: {{- toYaml .Values.local.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec: { selector: { app: redis }, ports: [{ name: redis, port: 6379, targetPort: redis }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: redis }
spec:
  serviceName: redis
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, initialDelaySeconds: 5 }
          livenessProbe: { exec: { command: ["redis-cli", "ping"] }, initialDelaySeconds: 15 }
          resources: {{- toYaml .Values.local.resources | nindent 12 }}
{{- end }}
