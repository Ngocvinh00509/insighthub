global: { environment: dev, ragMode: fixture }
images:
  web: { repository: insighthub-web, tag: dev, pullPolicy: IfNotPresent }
  api: { repository: insighthub-api, tag: dev, pullPolicy: IfNotPresent }
  worker: { repository: insighthub-worker, tag: dev, pullPolicy: IfNotPresent }
local:
  enabled: true
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
database:
  url: "postgresql://insighthub:insighthub@postgres:5432/insighthub"
  bootstrap:
    enabled: false
    image: "pgvector/pgvector:0.8.2-pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc"
redis: { url: "redis://redis:6379" }
providers: { llm: fixture, embedding: fixture }
resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
ingress: { enabled: true, className: nginx, host: insighthub.local, tlsSecret: "" }
hpa: { enabled: true, minReplicas: 1, maxReplicas: 2, cpu: 70 }
