# Day 5 ChatOps read-only identity. Apply only to the target lab namespace.
# No ClusterRole, ClusterRoleBinding, Secret access, exec, pods/log, or write verb.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: insighthub-chatops-readonly
  namespace: insighthub-dev
  labels:
    app.kubernetes.io/name: insighthub-chatops
    app.kubernetes.io/component: kubernetes-mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: insighthub-chatops-readonly
  namespace: insighthub-dev
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: insighthub-chatops-readonly
  namespace: insighthub-dev
subjects:
  - kind: ServiceAccount
    name: insighthub-chatops-readonly
    namespace: insighthub-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: insighthub-chatops-readonly
