rule_files:
  - prometheus-rules.yaml
evaluation_interval: 30s
tests:
  - name: queue backlog fires after three minutes
    interval: 30s
    input_series:
      - series: 'insighthub_queue_depth{namespace="insighthub-dev"}'
        values: '60+0x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: IngestionQueueBacklogAnomaly
        exp_alerts:
          - exp_labels:
              namespace: insighthub-dev
              severity: warning
              service: ingestion-worker
              team: insighthub
