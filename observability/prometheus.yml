global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: insighthub-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
  # LiteLLM is optional and runs only with the `litellm` Compose profile.
  # The metrics port stays on the private Compose network; it is not published.
  - job_name: litellm-proxy
    metrics_path: /metrics
    static_configs:
      - targets: [litellm:4000]
