apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: insighthub-servicemonitor
  namespace: insighthub-dev
  labels:
    release: kube-prometheus-stack
spec:
  # All five metric Services must share this label: web, api,
  # ingestion-worker, redis-exporter, and postgres-exporter.
  selector:
    matchLabels:
      app.kubernetes.io/part-of: insighthub
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
