            description: "API 5xx ratio in namespace {{ $labels.namespace }} exceeded 5% for two minutes. Check route/error metrics, providers, Redis, PostgreSQL, and deployment revision."
        - alert: InsightHubHighApiLatency
          expr: insighthub:api_latency_p95:5m > 5
          for: 2m
          labels: { severity: warning, service: api, team: insighthub }
          annotations:
            summary: "InsightHub API p95 latency is above 5 seconds"
            description: "API p95 latency in namespace {{ $labels.namespace }} remained above five seconds for two minutes. Correlate API, LLM, database, queue and pod metrics."
        - alert: InsightHubLlmlatencyAnomaly
          expr: insighthub:llm_latency_p95:5m > insighthub:llm_latency_upper:1h
          for: 2m
          labels: { severity: warning, service: api, team: insighthub }
          annotations:
            summary: "InsightHub LLM p95 latency exceeds anomaly band"
            description: "LLM p95 in namespace {{ $labels.namespace }} is above its one-hour mean plus 3 standard deviations for two minutes. Confirm baseline quality before escalation."
        - alert: InsightHubIngestionFailures
          expr: sum by (namespace) (increase(insighthub_ingestion_jobs_total{outcome="failed"}[5m])) >= 3
          for: 2m
          labels: { severity: critical, service: ingestion-worker, team: insighthub }
          annotations:
            summary: "InsightHub ingestion has three or more terminal failures"
            description: "At least three ingestion attempts failed in five minutes in {{ $labels.namespace }}. Inspect sanitized worker events, retries and provider health."
        - alert: InsightHubRedisQueueBacklog
          expr: (insighthub_queue_depth > insighthub:queue_depth_upper:1h) and (insighthub_queue_depth > 50)
          for: 3m
          labels: { severity: warning, service: ingestion-worker, team: insighthub }
          annotations:
            summary: "InsightHub Redis ingestion queue has more than 50 jobs"
            description: "ARQ queue in {{ $labels.namespace }} exceeded 50 pending jobs for three minutes. Check worker replicas, active jobs, retries and Redis health."
        - alert: InsightHubRedisQueueOldestJob
          expr: insighthub_queue_oldest_job_age_seconds > 300
          for: 3m
          labels: { severity: warning, service: ingestion-worker, team: insighthub }
          annotations:
            summary: "InsightHub queue has a job older than five minutes"
            description: "Oldest pending ARQ job in {{ $labels.namespace }} has remained older than five minutes. Verify worker progress before changing capacity."
        - alert: InsightHubPodRestarted
          expr: sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total{pod=~"insighthub-.*"}[15m])) > 0
          for: 1m
          labels: { severity: warning, service: kubernetes, team: insighthub }
          annotations:
            summary: "InsightHub container restarted"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} restarted in {{ $labels.namespace }}. Check pod events, limits and logs."
        - alert: InsightHubDeploymentUnavailable
          expr: min by (namespace, deployment) (kube_deployment_status_replicas_available{deployment=~"insighthub-(web|api|worker)"}) < min by (namespace, deployment) (kube_deployment_spec_replicas{deployment=~"insighthub-(web|api|worker)"})
          for: 5m
          labels: { severity: critical, service: kubernetes, team: insighthub }
          annotations:
            summary: "InsightHub deployment has unavailable replicas"
            description: "Deployment {{ $labels.deployment }} in {{ $labels.namespace }} has fewer available replicas than desired for five minutes."
